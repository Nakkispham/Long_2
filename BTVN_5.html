<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Page Sản Phẩm</title>
<link rel="stylesheet" href="style_5.css">
</head>
<body>

<header>
  <nav>
    <a href="#">Trang chủ</a>
    <a href="#">Sản phẩm</a>
    <a href="#">Liên hệ</a>
  </nav>
</header>

<section class="hero">
  <h1>MyShop</h1>
  <p>Sản phẩm chất lượng, giá tốt mỗi ngày</p>
</section>

<section class="products">
  <h2>Sản phẩm nổi bật</h2>

  <div class="product-card">
    <img src="https://picsum.photos/seed/ao1/300/200" alt="Áo thun basic">
    <span class="badge-sale">Sale 30%</span>
    <button class="btn-heart">❤️</button>
    <h3>Áo thun basic</h3>
    <p>210.000đ</p>
    <button>Mua ngay</button>
  </div>

  <div class="product-card">
    <img src="https://picsum.photos/seed/quan1/300/200" alt="Quần jean">
    <span class="badge-sale">Sale 20%</span>
    <button class="btn-heart">❤️</button>
    <h3>Quần jean</h3>
    <p>360.000đ</p>
    <button>Mua ngay</button>
  </div>

  <div class="product-card">
    <img src="https://picsum.photos/seed/giay1/300/200" alt="Giày sneaker">
    <span class="badge-sale">Sale 30%</span>
    <button class="btn-heart">❤️</button>
    <h3>Giày sneaker</h3>
    <p>560.000đ</p>
    <button>Mua ngay</button>
  </div>

  <div class="product-card">
    <img src="https://picsum.photos/seed/mu1/300/200" alt="Mũ lưỡi trai">
    <span class="badge-sale">Sale 15%</span>
    <button class="btn-heart">❤️</button>
    <h3>Mũ lưỡi trai</h3>
    <p>127.000đ</p>
    <button>Mua ngay</button>
  </div>

  <div class="product-card">
    <img src="https://picsum.photos/seed/balo1/300/200" alt="Ba lô">
    <span class="badge-sale">Sale 25%</span>
    <button class="btn-heart">❤️</button>
    <h3>Ba lô</h3>
    <p>375.000đ</p>
    <button>Mua ngay</button>
  </div>

  <div class="product-card">
    <img src="https://picsum.photos/seed/dongho1/300/200" alt="Đồng hồ">
    <span class="badge-sale">Sale 30%</span>
    <button class="btn-heart">❤️</button>
    <h3>Đồng hồ</h3>
    <p>700.000đ</p>
    <button>Mua ngay</button>
  </div>
</section>

<a href="#" class="btn-top">↑</a>

</body>
</html>
